name: "gaze-kde"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${PACKAGE_RELEASE}"
section: "admin"
priority: "optional"
maintainer: "Gundu Labs <maintainers@gundulabs.com>"
description: "KDE Plasma lock screen PAM integration for Gaze"
vendor: "Gundu Labs"
homepage: "https://gaze.gundulabs.com"
license: "MIT"

# /etc/pam.d/kde-fingerprint is owned by plasma-workspace on KDE, so this
# package must not ship that path (RPM rejects the file conflict). The
# postinstall script edits the existing service in place instead; this reference
# copy is the standalone stack it falls back to when the file is absent.
contents:
  - src: "packaging/pam/kde-fingerprint"
    dst: "/usr/share/gaze/pam/kde-fingerprint"
    type: "file"

deb:
  signature:
    method: debsign
    key_file: "${NFPM_SIGNING_KEY_FILE}"

rpm:
  signature:
    key_file: "${NFPM_SIGNING_KEY_FILE}"

scripts:
  postinstall: "packaging/postinst-kde.sh"
  postremove: "packaging/postrm-kde.sh"

overrides:
  deb:
    recommends:
      - gaze
  rpm:
    recommends:
      - gaze
  archlinux:
    recommends:
      - gaze
