name: "gaze-kde"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${PACKAGE_RELEASE}"
section: "admin"
priority: "optional"
maintainer: "Gundu Labs <maintainers@gundulabs.com>"
description: "KDE Plasma lock screen and System Settings integration for Gaze"
vendor: "Gundu Labs"
homepage: "https://gaze.gundulabs.com"
license: "GPL-3.0-or-later"

# Ships no /etc/pam.d/kde-fingerprint: plasma-workspace owns it, so RPM would reject the conflict.
contents:
  - src: "integrations/kde/gaze-kde-pam"
    dst: "/usr/bin/gaze-kde-pam"
    file_info:
      mode: 0755
  # System Settings scans this directory and launches the entry's Exec.
  - src: "integrations/kde/gaze-face-unlock.desktop"
    dst: "/usr/share/plasma/systemsettings/externalmodules/gaze-face-unlock.desktop"
    file_info:
      mode: 0644

deb:
  signature:
    method: debsign
    key_file: "${NFPM_SIGNING_KEY_FILE}"

rpm:
  signature:
    key_file: "${NFPM_SIGNING_KEY_FILE}"

archlinux:
  scripts:
    postupgrade: "packaging/postinst-kde.sh"

scripts:
  postinstall: "packaging/postinst-kde.sh"
  postremove: "packaging/postrm-kde.sh"

overrides:
  # RPM hosts build the System Settings page, so the staged tree replaces the external module that launches gaze-gui.
  rpm:
    contents:
      - src: "integrations/kde/gaze-kde-pam"
        dst: "/usr/bin/gaze-kde-pam"
        file_info:
          mode: 0755
      - src: "dist/kcm/usr/lib64/qt6/plugins/plasma/kcms/systemsettings/kcm_gaze.so"
        dst: "/usr/lib64/qt6/plugins/plasma/kcms/systemsettings/kcm_gaze.so"
        file_info:
          mode: 0755
      - src: "dist/kcm/usr/share/applications/kcm_gaze.desktop"
        dst: "/usr/share/applications/kcm_gaze.desktop"
        file_info:
          mode: 0644
    depends:
      - kf6-kirigami
${RPM_LIB_DEPENDS}
    recommends:
      - gaze
      - gaze-gui
  deb:
    recommends:
      - gaze
      - gaze-gui
  archlinux:
    recommends:
      - gaze
      - gaze-gui
