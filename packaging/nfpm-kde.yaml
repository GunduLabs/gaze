name: "gaze-kde"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${PACKAGE_RELEASE}"
section: "admin"
priority: "optional"
maintainer: "Gundu Labs <maintainers@gundulabs.com>"
description: "KDE Plasma lock screen and System Settings integration for Gaze"
vendor: "Gundu Labs"
homepage: "https://gaze.gundulabs.com"
license: "GPL-3.0-or-later"

# Ships no /etc/pam.d/kde-fingerprint: plasma-workspace owns it, so RPM would reject the conflict.
contents:
  - src: "integrations/kde/gaze-kde-pam"
    dst: "/usr/bin/gaze-kde-pam"
    file_info:
      mode: 0755
${KCM_CONTENTS}
deb:
  signature:
    method: debsign
    key_file: "${NFPM_SIGNING_KEY_FILE}"

rpm:
  signature:
    key_file: "${NFPM_SIGNING_KEY_FILE}"

archlinux:
  scripts:
    postupgrade: "packaging/postinst-kde.sh"

scripts:
  postinstall: "packaging/postinst-kde.sh"
  postremove: "packaging/postrm-kde.sh"

overrides:
  deb:
    depends:
${KCM_DEPENDS}
${DEB_LIB_DEPENDS}
    recommends:
      - gaze
${KCM_RECOMMENDS}
  rpm:
    depends:
${KCM_DEPENDS}
${RPM_LIB_DEPENDS}
    recommends:
      - gaze
  archlinux:
    depends:
${KCM_DEPENDS}
    recommends:
      - gaze
${KCM_RECOMMENDS}
