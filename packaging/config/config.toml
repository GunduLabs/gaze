# Security level determines which InsightFace models and threshold to use.
#
# Preset levels:
#   low: MobileFaceNet + SCRFD-500M, threshold 0.3  (fastest, least secure)
#   medium: MobileFaceNet + SCRFD-500M, threshold 0.4  (default)
#   high: ResNet50 + SCRFD-10G, threshold 0.5        (more accurate)
#   maximum: ResNet50 + SCRFD-10G, threshold 0.6        (strictest)
#
# Models are automatically downloaded from the official InsightFace GitHub
# releases if not already present in the models directory.

[inference]
# "cpu" uses the normal ONNX Runtime CPU execution provider.
# "openvino" requires a Gaze build compiled with the openvino Cargo feature
# and keeps the ONNX models while sending supported work through OpenVINO.
execution_provider = "cpu"
# Valid values: "cpu", "gpu", "npu". Use "cpu" with execution_provider = "cpu".
device = "cpu"

[security]
level = "medium"

# Custom level example:
# level = "custom"
# detector = "accurate"          # "standard" or "accurate"
# recognizer = "accurate"        # "standard" or "accurate"
# rgb_threshold = 0.45
# ir_threshold = 0.45
# hybrid_policy = "fallback_on_dark"  # optional; default, or, fallback_on_dark, and

[cameras]
rgb = "primary"
# Infrared (Windows Hello) camera. Set this to a direct /dev/video* node or the
# camera's GStreamer source string (e.g. "pipewiresrc target-object=<pipewire-target>").
# ir = "/dev/video2"
# Drive the camera's IR emitter (turn the IR LED on during auth). Requires `ir`.
# emitter_enabled = false
# Reject frames whose mean brightness (0-255) is below this value as too dark.
dark_luma_threshold = 20

[auth]
abort_if_ssh = true
abort_if_lid_closed = true
require_confirmation_lock_screen = false
require_confirmation_elevation = false
# Delay face auth by this many milliseconds on the first unlock after resuming from
# suspend, so the display has time to come back instead of unlocking behind a black
# screen. 0 disables it. Increase (e.g. 3000) if your GPU is slow to repaint.
resume_grace_ms = 0
# Wait this many milliseconds before face auth starts. Lockers such as hyprlock
# begin authenticating the instant they launch, so without a delay Gaze can unlock
# you again immediately after you lock manually and are still in front of the
# camera. 0 disables it.
#
# The wait is measured from the moment the session locked, not from each
# authentication, so a retry on the same lock screen does not pay it again.
#
# When resuming from suspend, whichever of this and resume_grace_ms is longer
# applies; they do not stack.
start_delay_ms = 0
# Which prompts wait for start_delay_ms.
#   "screen_lock" screen lockers only; sudo, polkit, su and greeters skip it
#   "all"         every face authentication, sudo and polkit included
# Gaze reads the PAM service name to tell these apart. A service it does not
# recognize counts as a screen lock, so an unusual locker still gets the delay.
start_delay_scope = "screen_lock"

[enrollment]
max_templates = 2
# Smallest accepted face bbox as a fraction of the frame's shorter side.
# Lower values allow enrollment from farther away; valid range: 0.10-0.75.
min_face_size_ratio = 0.25

# Liveness anti-spoofing runs a local MiniFASNet-V2 PAD model on the detected face crop.
# The model is downloaded into /var/cache/gaze on first use if missing.
[liveness]
enabled = true
threshold = 0.8
max_frames = 40

[storage]
# Encrypt face templates at rest with a TPM-sealed key (requires a TPM 2.0). See docs.
encrypt_templates = false
