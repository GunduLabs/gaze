name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.58.0
  NFPM_VERSION: v2.47.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: rustfmt
          build-deps: "false"

      - name: Check Justfile formatting
        run: just --fmt --check

      - name: Check Rust formatting
        run: just fmt-check

  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          build-deps: "false"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: just audit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: clippy
          cache-key: ci-lint-v1

      - name: Run clippy
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          cache-key: ci-test-v1

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: 2
        run: just test

  openvino:
    name: OpenVINO
    runs-on: ubuntu-latest
    env:
      ORT_STRATEGY: system
      ORT_LIB_LOCATION: /home/runner/ort-openvino/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
      LD_LIBRARY_PATH: /home/runner/ort-openvino/lib
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -Cdebuginfo=0

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: clippy
          cache-key: ci-openvino-v1

      - name: Provide an OpenVINO-enabled ONNX Runtime
        run: |
          set -euo pipefail
          version="$(just --evaluate ort_version)"
          wheel="$RUNNER_TEMP/ov-wheel"
          mkdir -p "$ORT_LIB_LOCATION" "$wheel"
          python3 -m pip download --no-deps --only-binary :all: \
            --python-version 3.12 --platform manylinux_2_28_x86_64 \
            "onnxruntime-openvino==$version" -d "$wheel"
          unzip -qo "$wheel"/*.whl 'onnxruntime/capi/lib*.so*' -d "$wheel/extracted"
          mv "$wheel"/extracted/onnxruntime/capi/lib*.so* "$ORT_LIB_LOCATION/"
          real="libonnxruntime.so.$version"
          soname="$(objdump -p "$ORT_LIB_LOCATION/$real" | awk '/SONAME/ { print $2 }')"
          test -n "$soname"
          ln -sf "$real" "$ORT_LIB_LOCATION/libonnxruntime.so"
          ln -sf "$real" "$ORT_LIB_LOCATION/$soname"
          objdump -T "$ORT_LIB_LOCATION/$real" \
            | grep -q OrtSessionOptionsAppendExecutionProvider_OpenVINO
          test -e "$ORT_LIB_LOCATION/$soname"

      - name: Run clippy with OpenVINO
        run: just lint-openvino

      - name: Run tests with OpenVINO
        run: just test-openvino

      - name: Build with OpenVINO
        run: just build-rust-openvino

  package:
    name: Package (${{ matrix.format }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, archlinux]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          apt-packages: dpkg-dev gettext-base checkpolicy semodule-utils
          cache-key: ci-package-v1

      - name: Build workspace
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
        run: just build-rust

      - name: Build SELinux policy
        run: |
          just build-selinux
          test -f dist/selinux/gaze-gdm-camera.pp

      - name: Install nfpm
        run: |
          nfpm_version="${NFPM_VERSION#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${nfpm_version}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build and verify ${{ matrix.format }} packages
        run: VERSION=0.0.0 just package-prebuilt ${{ matrix.format }}

  package-rpm:
    name: Package (rpm)
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      ORT_CACHE_DIR: /github/home/.ort-cache

    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y \
            git \
            ca-certificates \
            curl \
            clang \
            clang-devel \
            opencv-devel \
            libv4l-devel \
            pam-devel \
            tpm2-tss-devel \
            checkpolicy \
            policycoreutils \
            gtk4-devel \
            libadwaita-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            openssl-devel \
            pkg-config \
            gettext \
            gcc

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-package-rpm-v1
          cache-on-failure: true
          cache-directories: ${{ env.ORT_CACHE_DIR }}

      - name: Install nfpm
        run: |
          nfpm_version="${NFPM_VERSION#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${nfpm_version}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build workspace
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
        run: just build-rust

      - name: Build SELinux policy
        run: |
          just build-selinux
          test -f dist/selinux/gaze-gdm-camera.pp

      - name: Build and verify rpm packages
        run: VERSION=0.0.0 just package-prebuilt rpm

  srpm:
    name: Package (srpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          build-deps: "false"
          apt-packages: rpm zstd gettext-base
          cache-key: ci-srpm-v1

      - name: Build and verify source RPM
        run: VERSION=0.0.0 just srpm

  nix:
    name: Nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate flake packages
        run: |
          nix flake check --no-build
          for a in gaze gaze-gui gaze-gnome-extension; do
            nix eval --raw ".#packages.x86_64-linux.$a.drvPath"
            echo
          done

      - name: Evaluate NixOS module
        run: |
          nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              sys = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    boot.loader.grub.enable = false;
                    fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
                    system.stateVersion = "25.11";
                    services.gaze = {
                      enable = true;
                      gui.enable = true;
                      gnome.enable = true;
                    };
                    security.pam.services.login.gaze = {
                      enable = true;
                      simultaneous = true;
                    };
                    services.fprintd.enable = true;
                    security.tpm2.enable = true;
                  }
                ];
              };
            in sys.config.system.build.toplevel.drvPath
          '
