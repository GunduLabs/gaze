name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.58.0
  NFPM_VERSION: v2.47.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: rustfmt
          build-deps: "false"

      - name: Check Justfile formatting
        run: just --fmt --check

      - name: Check Rust formatting
        run: just fmt-check

  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          build-deps: "false"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: just audit

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: clippy
          cache-key: ci-lint-v1

      - name: Run clippy
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          cache-key: ci-test-v1

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: 2
        run: just test

  openvino:
    name: OpenVINO
    runs-on: ubuntu-latest
    env:
      ORT_STRATEGY: system
      ORT_LIB_LOCATION: /home/runner/ort-openvino/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
      LD_LIBRARY_PATH: /home/runner/ort-openvino/lib
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -Cdebuginfo=0

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          components: clippy
          cache-key: ci-openvino-v1

      - name: Provide an OpenVINO-enabled ONNX Runtime
        run: |
          set -euo pipefail
          version="$(just --evaluate ort_version)"
          wheel="$RUNNER_TEMP/ov-wheel"
          mkdir -p "$ORT_LIB_LOCATION" "$wheel"
          python3 -m pip download --no-deps --only-binary :all: \
            --python-version 3.12 --platform manylinux_2_28_x86_64 \
            "onnxruntime-openvino==$version" -d "$wheel"
          unzip -qo "$wheel"/*.whl 'onnxruntime/capi/lib*.so*' -d "$wheel/extracted"
          mv "$wheel"/extracted/onnxruntime/capi/lib*.so* "$ORT_LIB_LOCATION/"
          real="libonnxruntime.so.$version"
          soname="$(objdump -p "$ORT_LIB_LOCATION/$real" | awk '/SONAME/ { print $2 }')"
          test -n "$soname"
          ln -sf "$real" "$ORT_LIB_LOCATION/libonnxruntime.so"
          ln -sf "$real" "$ORT_LIB_LOCATION/$soname"
          objdump -T "$ORT_LIB_LOCATION/$real" \
            | grep -q OrtSessionOptionsAppendExecutionProvider_OpenVINO
          test -e "$ORT_LIB_LOCATION/$soname"

      - name: Run clippy with OpenVINO
        run: just lint-openvino

      - name: Run tests with OpenVINO
        run: just test-openvino

      - name: Build with OpenVINO
        run: just build-rust-openvino

  package:
    name: Package (${{ matrix.format }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      ORT_CACHE_DIR: /github/home/.ort-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            build_deps: "true"
            apt_packages: dpkg-dev gettext-base checkpolicy semodule-utils
            cache_key: ci-package-v1
          - format: archlinux
            build_deps: "true"
            apt_packages: dpkg-dev gettext-base checkpolicy semodule-utils
            cache_key: ci-package-v1
          - format: rpm
            container: fedora:45
            cache_key: ci-package-rpm-v1
          - format: srpm
            build_deps: "false"
            apt_packages: rpm zstd gettext-base
            cache_key: ci-srpm-v1

    steps:
      - name: Install Fedora dependencies
        if: ${{ matrix.format == 'rpm' }}
        run: |
          dnf install -y \
            git \
            ca-certificates \
            curl \
            clang \
            clang-devel \
            opencv-devel \
            libv4l-devel \
            pam-devel \
            tpm2-tss-devel \
            checkpolicy \
            policycoreutils \
            gtk4-devel \
            libadwaita-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-good \
            openssl-devel \
            pkg-config \
            gettext \
            gcc

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Trust workspace for git
        if: ${{ matrix.format == 'rpm' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        if: ${{ matrix.format == 'rpm' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        if: ${{ matrix.format == 'rpm' }}
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Restore Rust cache
        if: ${{ matrix.format == 'rpm' }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}
          cache-on-failure: true
          cache-directories: ${{ env.ORT_CACHE_DIR }}

      - name: Set up build environment
        if: ${{ matrix.format != 'rpm' }}
        uses: ./.github/actions/setup-build
        with:
          just-version: ${{ env.JUST_VERSION }}
          build-deps: ${{ matrix.build_deps }}
          apt-packages: ${{ matrix.apt_packages }}
          cache-key: ${{ matrix.cache_key }}

      - name: Install nfpm
        if: ${{ matrix.format != 'srpm' }}
        run: |
          nfpm_version="${NFPM_VERSION#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${nfpm_version}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          ${{ matrix.format == 'rpm' && 'tar' || 'sudo tar' }} -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build workspace
        if: ${{ matrix.format != 'srpm' }}
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
        run: just build-rust

      - name: Build SELinux policy
        if: ${{ matrix.format != 'srpm' }}
        run: |
          just build-selinux
          test -f dist/selinux/gaze-gdm-camera.pp

      - name: Build and verify ${{ matrix.format }} packages
        if: ${{ matrix.format != 'srpm' }}
        run: VERSION=0.0.0 just package-prebuilt ${{ matrix.format }}

      - name: Build and verify source RPM
        if: ${{ matrix.format == 'srpm' }}
        run: VERSION=0.0.0 just srpm

  package-flatpak:
    name: Package (flatpak, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Flatpak build environment
        uses: ./.github/actions/setup-flatpak
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Build and verify flatpak bundle
        env:
          FLATPAK_BUILDER_JOBS: 4
        run: |
          VERSION=0.0.0 just build-flatpak
          test -s "dist/packages/com.gundulabs.Gaze-${{ matrix.arch }}.flatpak"

  nix:
    name: Nix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate flake packages
        run: |
          nix flake check --no-build
          for a in gaze gaze-gui gaze-gnome-extension; do
            nix eval --raw ".#packages.x86_64-linux.$a.drvPath"
            echo
          done

      - name: Evaluate NixOS module
        run: |
          # Twice, because the KDE lock screen slot is chosen from these two
          # options: fprintd alone takes kde-smartcard, both together fall back
          # to sharing kde-fingerprint with the reader. One eval builds only one
          # of those branches.
          for p11 in false true; do
            echo "::group::nixos eval (security.pam.p11.enable = $p11)"
            nix eval --raw --impure --expr '
              let
                flake = builtins.getFlake (toString ./.);
                sys = flake.inputs.nixpkgs.lib.nixosSystem {
                  system = "x86_64-linux";
                  modules = [
                    flake.nixosModules.default
                    {
                      boot.loader.grub.enable = false;
                      fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
                      system.stateVersion = "25.11";
                      services.gaze = {
                        enable = true;
                        gui.enable = true;
                        gnome.enable = true;
                        kde.lockScreen = true;
                        kde.loginScreen = true;
                      };
                      security.pam.services.login.gaze = {
                        enable = true;
                        simultaneous = true;
                      };
                      services.fprintd.enable = true;
                      security.pam.p11.enable = '"$p11"';
                      security.tpm2.enable = true;
                    }
                  ];
                };
              in sys.config.system.build.toplevel.drvPath
            '
            echo
            echo "::endgroup::"
          done
