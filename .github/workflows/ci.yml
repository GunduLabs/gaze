name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.57.0
  NFPM_VERSION: v2.47.0
  # ort-sys extracts ONNX Runtime here and links it by absolute path, so it
  # must be a path rust-cache persists (default ~/.cache is not).
  ORT_CACHE_DIR: /home/runner/.ort-cache

jobs:
  checks:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            libcairo2-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libopencv-dev \
            libv4l-dev \
            libpam0g-dev \
            libtss2-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            dpkg-dev \
            gettext-base \
            checkpolicy \
            semodule-utils \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Check Justfile formatting
        run: just --fmt --check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # v2: v1 caches predate ORT_CACHE_DIR and can replay ort-sys link
          # paths into a directory that no longer exists.
          shared-key: build-deb-v2
          cache-on-failure: true
          cache-directories: ${{ env.ORT_CACHE_DIR }}

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Run tests
        run: just test

      - name: Run cargo audit
        run: just audit

      - name: Build workspace
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
        run: just build-rust

      - name: Build SELinux policy
        run: |
          just build-selinux
          test -f dist/selinux/gaze-gdm-camera.pp

      - name: Install nfpm
        run: |
          nfpm_version="${NFPM_VERSION#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${nfpm_version}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build and verify deb packages
        run: VERSION=0.0.0 just package-prebuilt deb

      # Catches spec and vendoring breakage here rather than in a Copr build.
      - name: Build and verify source RPM
        run: |
          sudo apt-get install -y --no-install-recommends rpm zstd gettext-base
          VERSION=0.0.0 just srpm

      - name: Build and verify archlinux packages
        run: VERSION=0.0.0 just package-prebuilt archlinux

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Evaluation-only; catches flake and module errors without a full build.
      - name: Evaluate flake packages
        run: |
          nix flake check --no-build
          for a in gaze gaze-gui gaze-gnome-extension; do
            nix eval --raw ".#packages.x86_64-linux.$a.drvPath"
            echo
          done

      - name: Evaluate NixOS module
        run: |
          nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              sys = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.default
                  {
                    boot.loader.grub.enable = false;
                    fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
                    system.stateVersion = "25.11";
                    services.gaze = {
                      enable = true;
                      gui.enable = true;
                      gnome.enable = true;
                      kde.lockScreen = true;
                      kde.loginScreen = true;
                    };
                    # Exercises pam.defaultServices, an explicitly enabled
                    # service on the nixpkgs PAM submodule, the
                    # gaze-before-fprintd rule ordering, and the TPM
                    # supplementary group.
                    security.pam.services.login.gaze = {
                      enable = true;
                      simultaneous = true;
                    };
                    services.fprintd.enable = true;
                    security.tpm2.enable = true;
                  }
                ];
              };
            in sys.config.system.build.toplevel.drvPath
          '
