name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      registry_owner: ${{ steps.lower.outputs.value }}
    steps:
      - id: lower
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  fmt:
    name: Format
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-ubuntu-amd64:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-ubuntu-amd64:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ubuntu24-amd64"
          shared-key: "check"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-ubuntu-amd64:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ubuntu24-amd64"
          shared-key: "check"
      - run: cargo test --workspace --locked

  package-deb:
    name: Package .deb (${{ matrix.arch }})
    needs: [prepare, fmt, clippy, test]
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            multiarch: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-ubuntu-${{ matrix.arch }}:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ubuntu24-${{ matrix.arch }}"
      - name: Build
        run: cargo build --workspace --release
      - name: Cache nfpm
        id: cache-nfpm
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nfpm
          key: nfpm-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install nfpm
        if: steps.cache-nfpm.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m | sed 's/aarch64/arm64/')
          VERSION=$(curl -sSf "https://api.github.com/repos/goreleaser/nfpm/releases/latest" | grep '"tag_name"' | head -1 | sed 's/.*"v\(.*\)".*/\1/')
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${VERSION}/nfpm_${VERSION}_Linux_${ARCH}.tar.gz" | tar -xz nfpm
          install -m755 nfpm /usr/local/bin/
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: VERSION=$VERSION ARCH=${{ matrix.arch }} MULTIARCH=${{ matrix.multiarch }} nfpm pkg --packager deb --target dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gaze-deb-${{ matrix.arch }}
          path: dist/*.deb

  package-rpm:
    name: Package .rpm (${{ matrix.arch }})
    needs: [prepare, fmt, clippy, test]
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            img_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            img_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-fedora-${{ matrix.img_arch }}:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "fedora-${{ matrix.arch }}"
      - name: Build
        run: cargo build --workspace --release
      - name: Cache nfpm
        id: cache-nfpm
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nfpm
          key: nfpm-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install nfpm
        if: steps.cache-nfpm.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m | sed 's/aarch64/arm64/')
          VERSION=$(curl -sSf "https://api.github.com/repos/goreleaser/nfpm/releases/latest" | grep '"tag_name"' | head -1 | sed 's/.*"v\(.*\)".*/\1/')
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${VERSION}/nfpm_${VERSION}_Linux_${ARCH}.tar.gz" | tar -xz nfpm
          install -m755 nfpm /usr/local/bin/
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: VERSION=$VERSION ARCH=${{ matrix.arch }} nfpm pkg --packager rpm --target dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gaze-rpm-${{ matrix.arch }}
          path: dist/*.rpm

  package-arch:
    name: Package .pkg.tar.zst (${{ matrix.arch }})
    needs: [prepare, fmt, clippy, test]
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            img_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            img_arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/${{ needs.prepare.outputs.registry_owner }}/gaze-build-arch-${{ matrix.img_arch }}:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "arch-${{ matrix.arch }}"
      - name: Build
        run: cargo build --workspace --release
      - name: Cache nfpm
        id: cache-nfpm
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/nfpm
          key: nfpm-${{ matrix.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install nfpm
        if: steps.cache-nfpm.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m | sed 's/aarch64/arm64/')
          VERSION=$(curl -sSf "https://api.github.com/repos/goreleaser/nfpm/releases/latest" | grep '"tag_name"' | head -1 | sed 's/.*"v\(.*\)".*/\1/')
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${VERSION}/nfpm_${VERSION}_Linux_${ARCH}.tar.gz" | tar -xz nfpm
          install -m755 nfpm /usr/local/bin/
      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: VERSION=$VERSION ARCH=${{ matrix.arch }} nfpm pkg --packager archlinux --target dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gaze-arch-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-deb, package-rpm, package-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
