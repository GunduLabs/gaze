name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag/version to build & deploy (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: cd-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.59.0
  NFPM_VERSION: v2.48.0

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      DEPLOY_REF_NAME: ${{ inputs.tag || github.ref_name }}
      ORT_CACHE_DIR: /github/home/.ort-cache
    strategy: &package-targets
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-noble-amd64
            name: deb (Ubuntu 24.04 noble, amd64)
            runner: ubuntu-latest
            container: ubuntu:24.04
            format: deb
            distro: ubuntu
            distro_version: "24.04"
            deb_suite: noble
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu24.04"
          - id: ubuntu-noble-arm64
            name: deb (Ubuntu 24.04 noble, arm64)
            runner: ubuntu-24.04-arm
            container: ubuntu:24.04
            format: deb
            distro: ubuntu
            distro_version: "24.04"
            deb_suite: noble
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu24.04"
          - id: ubuntu-questing-amd64
            name: deb (Ubuntu 25.10 questing, amd64)
            runner: ubuntu-latest
            container: ubuntu:25.10
            format: deb
            distro: ubuntu
            distro_version: "25.10"
            deb_suite: questing
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu25.10"
          - id: ubuntu-questing-arm64
            name: deb (Ubuntu 25.10 questing, arm64)
            runner: ubuntu-24.04-arm
            container: ubuntu:25.10
            format: deb
            distro: ubuntu
            distro_version: "25.10"
            deb_suite: questing
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu25.10"
          - id: ubuntu-resolute-amd64
            name: deb (Ubuntu 26.04 resolute, amd64)
            runner: ubuntu-latest
            container: ubuntu:26.04
            format: deb
            distro: ubuntu
            distro_version: "26.04"
            deb_suite: resolute
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu26.04"
          - id: ubuntu-resolute-arm64
            name: deb (Ubuntu 26.04 resolute, arm64)
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04
            format: deb
            distro: ubuntu
            distro_version: "26.04"
            deb_suite: resolute
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu26.04"
          - id: ubuntu-stonking-amd64
            name: deb (Ubuntu 26.10 stonking, amd64)
            runner: ubuntu-latest
            container: ubuntu:26.10
            format: deb
            distro: ubuntu
            distro_version: "26.10"
            deb_suite: stonking
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu26.10"
          - id: ubuntu-stonking-arm64
            name: deb (Ubuntu 26.10 stonking, arm64)
            runner: ubuntu-24.04-arm
            container: ubuntu:26.10
            format: deb
            distro: ubuntu
            distro_version: "26.10"
            deb_suite: stonking
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~ubuntu26.10"
          - id: debian-trixie-amd64
            name: deb (Debian 13 trixie, amd64)
            runner: ubuntu-latest
            container: debian:13
            format: deb
            distro: debian
            distro_version: "13"
            deb_suite: trixie
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~debian13"
          - id: debian-trixie-arm64
            name: deb (Debian 13 trixie, arm64)
            runner: ubuntu-24.04-arm
            container: debian:13
            format: deb
            distro: debian
            distro_version: "13"
            deb_suite: trixie
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~debian13"
          - id: debian-forky-amd64
            name: deb (Debian 14 forky, amd64)
            runner: ubuntu-latest
            container: debian:forky
            format: deb
            distro: debian
            distro_version: "14"
            deb_suite: forky
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~debian14"
          - id: debian-forky-arm64
            name: deb (Debian 14 forky, arm64)
            runner: ubuntu-24.04-arm
            container: debian:forky
            format: deb
            distro: debian
            distro_version: "14"
            deb_suite: forky
            rpm_distro: ""
            rpm_version: ""
            package_release: "1~debian14"
          - id: fedora-42-amd64
            name: rpm (Fedora 42, amd64)
            runner: ubuntu-latest
            container: fedora:42
            format: rpm
            distro: fedora
            distro_version: "42"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "42"
            package_release: "1.fc42"
          - id: fedora-42-arm64
            name: rpm (Fedora 42, arm64)
            runner: ubuntu-24.04-arm
            container: fedora:42
            format: rpm
            distro: fedora
            distro_version: "42"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "42"
            package_release: "1.fc42"
          - id: fedora-43-amd64
            name: rpm (Fedora 43, amd64)
            runner: ubuntu-latest
            container: fedora:43
            format: rpm
            distro: fedora
            distro_version: "43"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "43"
            package_release: "1.fc43"
          - id: fedora-43-arm64
            name: rpm (Fedora 43, arm64)
            runner: ubuntu-24.04-arm
            container: fedora:43
            format: rpm
            distro: fedora
            distro_version: "43"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "43"
            package_release: "1.fc43"
          - id: fedora-44-amd64
            name: rpm (Fedora 44, amd64)
            runner: ubuntu-latest
            container: fedora:44
            format: rpm
            distro: fedora
            distro_version: "44"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "44"
            package_release: "1.fc44"
          - id: fedora-44-arm64
            name: rpm (Fedora 44, arm64)
            runner: ubuntu-24.04-arm
            container: fedora:44
            format: rpm
            distro: fedora
            distro_version: "44"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "44"
            package_release: "1.fc44"
          - id: fedora-45-amd64
            name: rpm (Fedora 45, amd64)
            runner: ubuntu-latest
            container: fedora:45
            format: rpm
            distro: fedora
            distro_version: "45"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "45"
            package_release: "1.fc45"
          - id: fedora-45-arm64
            name: rpm (Fedora 45, arm64)
            runner: ubuntu-24.04-arm
            container: fedora:45
            format: rpm
            distro: fedora
            distro_version: "45"
            deb_suite: ""
            rpm_distro: fedora
            rpm_version: "45"
            package_release: "1.fc45"
          - id: opensuse-tumbleweed-amd64
            name: rpm (openSUSE Tumbleweed, amd64)
            runner: ubuntu-latest
            container: opensuse/tumbleweed:latest
            format: rpm
            distro: opensuse
            distro_version: tumbleweed
            deb_suite: ""
            rpm_distro: opensuse
            rpm_version: tumbleweed
            package_release: "1.opensuse.tumbleweed"
          - id: arch
            name: archlinux (Arch Linux)
            runner: ubuntu-latest
            container: archlinux:latest
            format: archlinux
            distro: archlinux
            distro_version: rolling
            deb_suite: ""
            rpm_distro: ""
            rpm_version: ""
            package_release: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up build host
        uses: ./.github/actions/setup-package-host
        with:
          format: ${{ matrix.format }}
          distro: ${{ matrix.distro }}
          deb-suite: ${{ matrix.deb_suite }}
          just-version: ${{ env.JUST_VERSION }}
          nfpm-version: ${{ env.NFPM_VERSION }}
          rust: "true"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cd-${{ matrix.id }}-v2
          cache-on-failure: true
          cache-directories: ${{ env.ORT_CACHE_DIR }}

      - name: Build native artifacts
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
          GAZE_KCM: ${{ matrix.deb_suite == 'noble' && 'legacy' || 'plasma6' }}
        run: |
          VERSION="${DEPLOY_REF_NAME#v}" just build-rust
          VERSION="${DEPLOY_REF_NAME#v}" just build-selinux
          VERSION="${DEPLOY_REF_NAME#v}" just build-kcm "${{ matrix.format }}"

      - name: Archive native artifacts
        run: |
          mkdir -p dist/selinux dist/kcm
          tar -cf native.tar \
            target/release/gaze \
            target/release/gaze-gui \
            target/release/gazed \
            target/release/libpam_gaze.so \
            target/release/libpam_gaze_grosshack.so \
            dist/selinux \
            dist/kcm

      - name: Upload native artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.id }}
          path: native.tar
          retention-days: 1

  package-native:
    name: Package ${{ matrix.name }}
    needs: build-native
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      DEPLOY_REF_NAME: ${{ inputs.tag || github.ref_name }}
      ORT_CACHE_DIR: /github/home/.ort-cache
    strategy: *package-targets

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up packaging host
        uses: ./.github/actions/setup-package-host
        with:
          format: ${{ matrix.format }}
          distro: ${{ matrix.distro }}
          deb-suite: ${{ matrix.deb_suite }}
          just-version: ${{ env.JUST_VERSION }}
          nfpm-version: ${{ env.NFPM_VERSION }}

      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.id }}

      - name: Unpack native artifacts
        run: |
          tar -xf native.tar
          rm native.tar

      - name: Prepare nfpm signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is empty; refusing to publish unsigned packages"
            exit 1
          fi
          key_file="$RUNNER_TEMP/nfpm-signing-key.asc"
          (umask 077 && printf '%s' "$GPG_PRIVATE_KEY" > "$key_file")
          echo "NFPM_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Package native artifacts
        run: |
          VERSION="${DEPLOY_REF_NAME#v}" PACKAGE_RELEASE="${{ matrix.package_release }}" just package-prebuilt "${{ matrix.format }}"
          ls -lh dist/packages/

      - name: Remove nfpm signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/nfpm-signing-key.asc"

      - name: Write package target metadata
        run: |
          cat > dist/packages/package-target.env <<EOF
          FORMAT=${{ matrix.format }}
          DISTRO=${{ matrix.distro }}
          DISTRO_VERSION=${{ matrix.distro_version }}
          DEB_SUITE=${{ matrix.deb_suite }}
          RPM_DISTRO=${{ matrix.rpm_distro }}
          RPM_VERSION=${{ matrix.rpm_version }}
          EOF

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.id }}
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/*.pkg.tar.*
            dist/packages/package-target.env

  build-flatpak:
    name: Build flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      DEPLOY_REF_NAME: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Flatpak build environment
        uses: ./.github/actions/setup-flatpak
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Require signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is empty; refusing to publish an unsigned flatpak"
            exit 1
          fi

      - name: Import GPG key for flatpak signing
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.PACKAGE_SIGNING_KEY }}

      - name: Build flatpak repo and bundle
        env:
          FLATPAK_GPG_SIGN: ${{ steps.import_gpg.outputs.fingerprint }}
          FLATPAK_BUILDER_JOBS: 4
        run: |
          VERSION="${DEPLOY_REF_NAME#v}" just build-flatpak

      - name: Upload flatpak bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-flatpak-${{ matrix.arch }}
          path: dist/packages/*.flatpak

      - name: Upload flatpak remote metadata
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-flatpak-metadata
          path: |
            dist/packages/*.flatpakref
            dist/packages/*.flatpakrepo

  build-srpm:
    name: Build source RPM for Copr
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      DEPLOY_REF_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Install srpm tooling
        run: |
          dnf install -y \
            git \
            ca-certificates \
            curl \
            tar \
            gzip \
            zstd \
            gettext \
            gnupg2 \
            rpm-build \
            rpm-sign

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is empty; refusing to publish an unsigned source RPM"
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "RPM_SIGN_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Build source RPM
        run: |
          VERSION="${DEPLOY_REF_NAME#v}" just srpm
          ls -lh dist/packages/

      - name: Upload source RPM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-srpm
          path: |
            dist/packages/*.src.rpm
            dist/packages/copr-target.env

  dispatch-packages:
    name: Dispatch packages to self-hosted repo
    runs-on: ubuntu-latest
    permissions: {}
    needs: [package-native, build-flatpak, build-srpm]

    steps:
      - name: Trigger GunduLabs/packages publish
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PACKAGES_REPO_PAT }}
          repository: GunduLabs/packages
          event-type: package-artifacts
          client-payload: '{"repo":"${{ github.repository }}","run_id":"${{ github.run_id }}","url":"https://gaze.gundulabs.com"}'

  release-github:
    name: Upload packages to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [package-native, build-flatpak, build-srpm]
    env:
      DEPLOY_REF_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist/packages

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.DEPLOY_REF_NAME }}
          files: |
            dist/packages/**/*.deb
            dist/packages/**/*.rpm
            dist/packages/**/*.src.rpm
            dist/packages/**/*.pkg.tar.*
            dist/packages/**/*.flatpak
            dist/packages/**/*.flatpakref
            dist/packages/**/*.flatpakrepo
