name: Dependabot

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Minor and patch bumps only. Majors, and anything without a semver update
      # type such as a container digest refresh, are left for a human. The
      # approval satisfies the review the main ruleset requires; the merge waits
      # on the required status checks.
      - name: Approve and enable auto-merge
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
