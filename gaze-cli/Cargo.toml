[package]
name = "gaze-cli"
version = "0.3.0"
edition = "2024"
description = "Command-line facial authentication client for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = []
openvino = ["gaze-core/openvino-config"]

[[bin]]
name = "gaze"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
console = "0.16.4"
crossterm = "0.29"
dialoguer = "0.12"
futures = "0.3.34"
gaze-core = { path = "../gaze-core", default-features = false }
libc = "0.2.189"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
zbus = "5.19.0"
