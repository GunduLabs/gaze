[package]
name = "gaze-core"
version = "0.3.1"
edition = "2024"
description = "Shared configuration, D-Bus, and IR device library for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[features]
openvino-config = []

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
zbus = "5.19.0"
zvariant = "5.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_plain = "1.0.2"
tracing = "0.1.44"
toml_edit = { version = "0.25.15", features = ["serde"] }
strum = "0.28"
strum_macros = "0.28"

[build-dependencies]
toml_edit = { version = "0.25.15", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
