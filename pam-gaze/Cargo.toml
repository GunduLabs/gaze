[package]
name = "pam-gaze"
version = "0.3.0"
edition = "2024"
description = "Facial authentication PAM module for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
gaze-core = { path = "../gaze-core", default-features = false }
libc = "0.2.189"
zbus = "5.19.0"
tokio = { version = "1.53.1", features = ["full"] }
parking_lot = "0.12.5"
anyhow = "1.0.104"
futures = "0.3.34"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
