[package]
name = "gaze-vision"
version = "0.3.2"
edition = "2024"
description = "Camera capture, face detection, and inference for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["detection"]
detection = ["dep:ort"]
openvino = ["detection", "gaze-core/openvino-config", "ort/openvino"]

[dependencies]
gaze-core = { path = "../gaze-core" }
anyhow = "1.0.104"
ndarray = "0.17.2"
opencv = { version = "0.100.1", default-features = false, features = ["imgproc"] }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "api-21",
] }
tracing = "0.1.44"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.3"
