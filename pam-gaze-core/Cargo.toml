[package]
name = "pam-gaze-core"
version = "0.2.10"
edition = "2024"
description = "Shared PAM authentication and FFI implementation for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[lib]

[dependencies]
gaze-core = { path = "../gaze-core", default-features = false }
