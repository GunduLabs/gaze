[package]
name = "gazed"
version.workspace = true
edition.workspace = true
description = "Linux facial authentication daemon and machine-learning pipeline for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = []
openvino = ["gaze-vision/openvino", "ort/openvino"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
gaze-core.workspace = true
gaze-security.workspace = true
gaze-vision = { workspace = true, features = ["detection"] }
getrandom.workspace = true
image = { workspace = true, features = ["jpeg"] }
libc.workspace = true
nalgebra.workspace = true
ndarray.workspace = true
opencv = { workspace = true, features = ["imgproc"] }
ort.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full", "rt-multi-thread"] }
ureq.workspace = true
uuid = { workspace = true, features = ["v4"] }
zbus.workspace = true
zip.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
futures.workspace = true
zbus_polkit.workspace = true
tss-esapi.workspace = true
zeroize.workspace = true

