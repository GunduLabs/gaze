[package]
name = "pam-gaze-grosshack"
version = "0.2.9"
edition = "2024"
description = "Simultaneous face and password authentication PAM module for Gaze"
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pam-gaze-core = { path = "../pam-gaze-core" }
gaze-core = { path = "../gaze-core", default-features = false }
libc = "0.2.189"
zbus = "5.18.0"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"
anyhow = "1.0.104"
